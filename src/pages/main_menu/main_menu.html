<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界的低语 : 启示录</title>
</head>
<body>
    <!-- 背景图片容器 -->
    <div class="background-container">
        <img id="backgroundImage" alt="Background Image">
    </div>

    <!-- 音频元素 -->
    <audio id="music" loop></audio>

    <div class="main-container">
        <!-- 左半区：作为 Logo 承载区域（保持类名 illustration-panel 兼容） -->
        <div class="illustration-panel"></div>

        <!-- 右半区：内容与菜单 -->
        <div class="content-area">
           
            <div class="menu-container">
                <!-- 关于我们按钮（新增） -->
                <button class="menu-button" id="aboutUsButton">
                    <span>About Us</span>
                </button>

                <!-- 主要菜单按钮 -->
                <button class="menu-button" id="startButton">
                    <span>New game</span>
                </button>

                <button class="menu-button" id="loadButton">
                    <span>Load</span>
                </button>

                <button class="menu-button" id="settingButton">
                    <span>Config</span>
                </button>

                <button class="menu-button" id="achievementButton">
                    <span>Achievement</span>
                </button>

                <button class="menu-button" id="CGButton">
                    <span>CG library</span>
                </button>

                <button class="menu-button" id="MusicButton">
                    <span>Music library</span>
                </button>

                <button class="menu-button" id="exitButton">
                    <span>Exit</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
