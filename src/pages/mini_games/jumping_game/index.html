<!-- 跳一跳小游戏的基础HTML结构 -->
<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="game-ui">
        <div id="score">分数: 0</div>
        <div id="game-over" class="hidden">
            <h2>游戏结束</h2>
            <div id="final-score">最终得分: 0</div>
            <button id="restart-button">重新开始</button>
        </div>
    </div>
</div>
